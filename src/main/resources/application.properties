spring.application.name=asian-auto-hub
# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/asian_auto_hub
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/asian_auto_hub
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Prevent Hibernate from modifying schema
spring.jpa.generate-ddl=false

# Security - JWT
security.jwt.secret=${JWT_SECRET:saiofal;vkasfbehwqpofhjashofjaswfpojasfvbafop[hfifonfo[shjfwefjjfslajfsahfoshffasnbash[f}
security.jwt.issuer=${JWT_ISSUER:api.substring.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

# Application
app.cors.front-end-url=${FRONT_END_URL:http://localhost:5173}
#app.auth.frontend.success-redirect=${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
#app.auth.frontend.failure-redirect=${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
logging.level.org.springframework.security=DEBUG
